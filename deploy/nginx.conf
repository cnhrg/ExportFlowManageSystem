server {
    listen 6666;
    listen [::]:6666;
    listen 8088;
    listen [::]:8088;
    server_name _;
    root /var/www/export-logistics/current;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;
    auth_basic "Export Logistics";
    auth_basic_user_file /etc/nginx/export-logistics.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location ~ (^|/)\. {
        deny all;
    }

    location /deploy/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
