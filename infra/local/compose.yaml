name: export-trade-local
services:
  s3:
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    command: ["/data"]
    restart: unless-stopped
    env_file:
      - ${LOCAL_INFRA_DIR:?Set LOCAL_INFRA_DIR}/rustfs.env
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  antivirus:
    image: clamav/clamav@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e
    platform: linux/amd64
    restart: unless-stopped
    environment:
      CLAMD_STARTUP_TIMEOUT: "240"
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - antivirus-signatures:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  s3-data:
  antivirus-signatures:
